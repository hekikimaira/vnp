<script>
// ============================================================
//  Utility
// ============================================================
const $ = id => document.getElementById(id);
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
function showToast(msg) {
    const t = document.createElement('div');
    t.style.cssText = 'position:fixed;bottom:20%;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.8);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.1);color:#fff;padding:12px 24px;z-index:300;font-size:12px;letter-spacing:0.1em;';
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 1500);
}
function generateProjectId(s) {
    const str = JSON.stringify(s.map(x => x.id));
    let h = 0;
    for (let i = 0; i < str.length; i++) { h = ((h << 5) - h) + str.charCodeAt(i); h |= 0; }
    return Math.abs(h).toString(36);
}

// ============================================================
//  Debug Logger
// ============================================================
const Debug = {
    enabled: false,
    maxEntries: 500,
    log(msg, type = 'info') {
        const con = $('debugLog');
        if (!con) return;
        const entry = document.createElement('div');
        entry.className = `debug-log-entry ${type}`;
        const now = new Date();
        const ts = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0') + ':' + String(now.getSeconds()).padStart(2, '0') + '.' + String(now.getMilliseconds()).padStart(3, '0');
        entry.innerHTML = `<span class="debug-time">${ts}</span>${msg}`;
        con.appendChild(entry);
        if (con.children.length > this.maxEntries) con.firstChild.remove();
        con.scrollTop = con.scrollHeight;
    }
};
// Shorthand
function dlog(msg, type) { Debug.log(msg, type); }

// ============================================================
//  AudioManager — BGM / SE の再生・停止・音量管理
// ============================================================
const AudioManager = {
    ctx: null,
    seBuffers: {},
    bgmBuffers: {},
    seAudios: {},      // 後方互換
    bgmAudios: {},     // 後方互換
    currentBgmSource: null,
    currentBgmGain: null,
    currentBgm: null,
    loopingSe: {},
    bgmVolume: 0.7,
    seVolume: 1.0,

    getCtx() {
        if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        return this.ctx;
    },
    unlock() {
        const ctx = this.getCtx();
        if (ctx.state === 'suspended') ctx.resume().then(() => dlog('AudioContext resumed: ' + ctx.state, 'audio'));
        dlog('AudioContext state: ' + ctx.state, 'audio');
    },
    async playSE(name, count) {
        dlog('playSE: ' + name + ' count=' + count + ' keys=[' + Object.keys(this.seBuffers).join(',') + ']', 'audio');
        const buf = this.seBuffers[name];
        if (!buf) { dlog('SE not found: ' + name, 'error'); return; }
        const ctx = this.getCtx();
        if (ctx.state === 'suspended') await ctx.resume();
        const gain = ctx.createGain();
        gain.gain.value = this.seVolume;
        gain.connect(ctx.destination);
        if (count === 0) {
            const playLoop = () => {
                const src = ctx.createBufferSource();
                src.buffer = buf; src.connect(gain);
                src.onended = () => { if (this.loopingSe[name]) playLoop(); };
                src.start(0);
                this.loopingSe[name] = { source: src, gain };
            };
            playLoop();
            dlog('SE loop start: ' + name, 'audio');
            return;
        }
        const src = ctx.createBufferSource();
        src.buffer = buf; src.connect(gain); src.start(0);
        dlog('SE playing: ' + name, 'audio');
    },
    stopSE(name) {
        if (!this.loopingSe[name]) return;
        try { this.loopingSe[name].source.stop(); } catch (e) {}
        delete this.loopingSe[name];
        dlog('SE stopped: ' + name, 'audio');
    },
    stopAllSE() {
        Object.keys(this.loopingSe).forEach(name => this.stopSE(name));
    },
    playBGM(name) {
        dlog('playBGM: ' + name + ' keys=[' + Object.keys(this.bgmBuffers).join(',') + ']', 'audio');
        this.stopBGM();
        const buf = this.bgmBuffers[name];
        if (!buf) { dlog('BGM not found: ' + name, 'error'); return; }
        const ctx = this.getCtx();
        if (ctx.state === 'suspended') ctx.resume();
        const gain = ctx.createGain();
        gain.gain.value = this.bgmVolume;
        gain.connect(ctx.destination);
        const src = ctx.createBufferSource();
        src.buffer = buf; src.loop = true; src.connect(gain); src.start(0);
        this.currentBgmSource = src;
        this.currentBgmGain = gain;
        this.currentBgm = name;
        dlog('BGM playing: ' + name, 'audio');
    },
    stopBGM() {
        if (this.currentBgmSource) { try { this.currentBgmSource.stop(); } catch (e) {} }
        this.currentBgmSource = null;
        this.currentBgmGain = null;
        this.currentBgm = null;
    },
    clearAll() {
        Object.keys(this.seBuffers).forEach(k => delete this.seBuffers[k]);
        Object.keys(this.bgmBuffers).forEach(k => delete this.bgmBuffers[k]);
        Object.keys(this.seAudios).forEach(k => delete this.seAudios[k]);
        Object.keys(this.bgmAudios).forEach(k => delete this.bgmAudios[k]);
        this.currentBgm = null;
        if (this.currentBgmSource) { try { this.currentBgmSource.stop(); } catch (e) {} }
        this.currentBgmSource = null;
        this.currentBgmGain = null;
        Object.keys(this.loopingSe).forEach(k => { try { this.loopingSe[k].source.stop(); } catch (e) {} });
        this.loopingSe = {};
    }
};

// ============================================================
//  TimerManager — グローバルタイマー / 選択肢タイマー
// ============================================================
const TimerManager = {
    globalTimers: {},
    globalTimerInterval: null,
    timedChoiceTimer: null,

    formatTime(sec) {
        const m = Math.floor(sec / 60);
        const s = Math.floor(sec % 60);
        return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
    },
    updateDisplay() {
        let activeTimer = null;
        for (const id in this.globalTimers) {
            const t = this.globalTimers[id];
            if (t && t.remaining > 0) { activeTimer = t; break; }
        }
        const el = $('globalTimer');
        if (!activeTimer || !activeTimer.show) { el.classList.add('hidden'); return; }
        el.classList.remove('hidden');
        el.textContent = this.formatTime(activeTimer.remaining);
        el.classList.toggle('urgent', activeTimer.remaining <= 10);
    },
    startTick() {
        if (this.globalTimerInterval) return;
        this.globalTimerInterval = setInterval(() => {
            for (const id in this.globalTimers) {
                const t = this.globalTimers[id];
                if (t && t.mode === 'realtime' && t.remaining > 0) { t.remaining = Math.max(0, t.remaining - 0.1); }
            }
            this.updateDisplay();
        }, 100);
    },
    stopTick() {
        if (this.globalTimerInterval) { clearInterval(this.globalTimerInterval); this.globalTimerInterval = null; }
    },
    start(id, seconds, mode, show) {
        this.globalTimers[id] = { seconds, mode, remaining: seconds, show };
        if (mode === 'realtime') this.startTick();
        this.updateDisplay();
    },
    end(id) {
        if (this.globalTimers[id]) delete this.globalTimers[id];
        if (Object.keys(this.globalTimers).length === 0) this.stopTick();
        this.updateDisplay();
    },
    decrement(id, delta) {
        if (this.globalTimers[id]) { this.globalTimers[id].remaining = Math.max(0, this.globalTimers[id].remaining - delta); }
        this.updateDisplay();
    },
    reset() {
        this.stopTick();
        this.globalTimers = {};
        this.updateDisplay();
    }
};

// ============================================================
//  CounterManager — ゲーム内カウンター
// ============================================================
const CounterManager = {
    counters: {},
    projectId: null,

    _key() { return this.projectId ? `vn-${this.projectId}-counters` : 'vn-counters'; },
    load() { try { const d = JSON.parse(localStorage.getItem(this._key())); if (d) this.counters = d; } catch (e) { this.counters = {}; } },
    save() { localStorage.setItem(this._key(), JSON.stringify(this.counters)); },
    set(name, val) { this.counters[name] = val; this.save(); },
    add(name, delta) { this.counters[name] = (this.counters[name] || 0) + delta; this.save(); },
    reset(name) { this.counters[name] = 0; this.save(); },
    get(name) { return this.counters[name] || 0; }
};

// ============================================================
//  SaveManager — セーブ/ロード/スロット管理
// ============================================================
const SaveManager = {
    projectId: null,

    _key(key) { return this.projectId ? `vn-${this.projectId}-${key}` : `vn-${key}`; },
    saveProgress(state) {
        localStorage.setItem(this._key('progress'), JSON.stringify({
            seenScenes: [...state.seenScenes],
            bgmVolume: AudioManager.bgmVolume,
            seVolume: AudioManager.seVolume,
            textSpeed: state.textSpeed,
            autoSpeed: state.autoSpeed,
            fontSize: state.fontSize
        }));
    },
    loadProgress(state) {
        try {
            const d = JSON.parse(localStorage.getItem(this._key('progress')));
            if (d) {
                state.seenScenes = new Set(d.seenScenes || []);
                AudioManager.bgmVolume = d.bgmVolume ?? 0.7;
                AudioManager.seVolume = d.seVolume ?? 1.0;
                state.textSpeed = d.textSpeed ?? 70;
                state.autoSpeed = d.autoSpeed ?? 2000;
                state.fontSize = d.fontSize || 'm';
            }
        } catch (e) {}
    },
    saveSlot(n, state) {
        const s = state.scenes[state.currentIndex];
        localStorage.setItem(this._key(`slot-${n}`), JSON.stringify({
            currentIndex: state.currentIndex,
            flags: { ...state.flags },
            lastChoiceId: state.lastChoiceId,
            seenScenes: [...state.seenScenes],
            backlog: state.backlog.slice(-50),
            globalTimers: { ...TimerManager.globalTimers },
            timestamp: Date.now(),
            sceneName: s?.name || '',
            sceneText: (s?.text || '').slice(0, 30)
        }));
        this.saveProgress(state);
    },
    loadSlot(n, state) {
        try {
            const d = JSON.parse(localStorage.getItem(this._key(`slot-${n}`)));
            if (d) {
                state.currentIndex = d.currentIndex || 0;
                state.flags = d.flags || {};
                state.lastChoiceId = d.lastChoiceId || null;
                state.seenScenes = new Set(d.seenScenes || []);
                state.backlog = d.backlog || [];
                TimerManager.globalTimers = d.globalTimers || {};
                if (Object.keys(TimerManager.globalTimers).length > 0) {
                    for (const id in TimerManager.globalTimers) {
                        if (TimerManager.globalTimers[id].mode === 'realtime') TimerManager.startTick();
                    }
                }
                TimerManager.updateDisplay();
                return true;
            }
        } catch (e) {}
        return false;
    },
    getSlotInfo(n) {
        try {
            const d = JSON.parse(localStorage.getItem(this._key(`slot-${n}`)));
            if (d) return { exists: true, date: new Date(d.timestamp).toLocaleString('ja-JP'), sceneName: d.sceneName, sceneText: d.sceneText };
        } catch (e) {}
        return { exists: false };
    }
};

// ============================================================
//  OverlayManager — キーフレームアニメーション / オーバーレイ
// ============================================================
const OverlayManager = {
    active: {},
    keyframeCounter: 0,
    container: null,      // 初期化時にセット
    imageBlobs: null,     // GameStateへの参照

    init(container, imageBlobs) {
        this.container = container;
        this.imageBlobs = imageBlobs;
    },
    clearAll() {
        this.container.innerHTML = '';
        this.active = {};
    },
    parseEasing(e) {
        const map = { linear: 'linear', easein: 'ease-in', easeout: 'ease-out', easeinout: 'ease-in-out', bounce: 'cubic-bezier(0.68,-0.55,0.265,1.55)' };
        return map[(e || 'easeout').toLowerCase()] || 'ease-out';
    },
    parseSpeed(s) {
        if (!s) return 500;
        if (typeof s === 'number') return s;
        const str = String(s).toLowerCase();
        if (str === 'slow') return 1000;
        if (str === 'fast') return 200;
        if (str === 'normal') return 500;
        return parseInt(str) || 500;
    },
    parseNewSyntax(cmd) {
        // Arrow: ↑(a,b) ↓(a,b) →(a,b) ←(a,b)
        const arrowMatch = cmd.match(/^([↑↓→←])\((-?[\d.]+),(-?[\d.]+)\)(?::(.+))?$/);
        if (arrowMatch) {
            const dir = arrowMatch[1];
            const a = parseFloat(arrowMatch[2]);
            const b = parseFloat(arrowMatch[3]);
            const rest = arrowMatch[4] || '';
            const restParts = rest.split(':');
            const speed = this.parseSpeed(restParts[0]);
            const easing = this.parseEasing(restParts[1]);
            const loopStr = restParts[2];
            const loopCount = loopStr === 'loop' ? Infinity : (parseInt(loopStr) || 1);
            let points;
            if (dir === '↑' || dir === '↓') {
                points = [{ x: 50, y: a }, { x: 50, y: b }];
            } else {
                points = [{ x: a, y: 50 }, { x: b, y: 50 }];
            }
            return { points, speed, easing, loopCount };
        }
        // JUMP(x1,y1),(x2,y2):speed:easing:loop
        const jumpMatch = cmd.match(/^JUMP\((-?[\d.]+),(-?[\d.]+)\),\((-?[\d.]+),(-?[\d.]+)\)(?::(.+))?$/i);
        if (jumpMatch) {
            const sx = parseFloat(jumpMatch[1]), sy = parseFloat(jumpMatch[2]);
            const ex = parseFloat(jumpMatch[3]), ey = parseFloat(jumpMatch[4]);
            const rest = jumpMatch[5] || '';
            const restParts = rest.split(':');
            const speed = this.parseSpeed(restParts[0] || '800ms');
            const easing = this.parseEasing(restParts[1] || 'easeinout');
            const loopStr = restParts[2];
            const loopCount = loopStr === 'loop' ? Infinity : (parseInt(loopStr) || 1);
            const dx = Math.abs(ex - sx), dy = Math.abs(ey - sy);
            const dist = Math.sqrt(dx * dx + dy * dy);
            const jumpHeight = Math.max(dist * 0.3, 15);
            const steps = 16;
            const points = [];
            for (let i = 0; i <= steps; i++) {
                const t = i / steps;
                const x = sx + (ex - sx) * t;
                const baseY = sy + (ey - sy) * t;
                const arc = -4 * jumpHeight * t * (1 - t);
                points.push({ x, y: baseY + arc });
            }
            return { points, speed, easing, loopCount };
        }
        // FLOAT(x,y):speed:loop
        const floatMatch = cmd.match(/^FLOAT\((-?[\d.]+),(-?[\d.]+)\)(?::(.+))?$/i);
        if (floatMatch) {
            const x = parseFloat(floatMatch[1]), y = parseFloat(floatMatch[2]);
            const rest = floatMatch[3] || '';
            const restParts = rest.split(':');
            const speed = this.parseSpeed(restParts[0] || '2000ms');
            const easing = this.parseEasing(restParts[1] || 'easeinout');
            const loopStr = restParts[2];
            const loopCount = loopStr === 'loop' ? Infinity : (parseInt(loopStr) || 1);
            const drift = 3;
            const points = [{ x, y }, { x, y: y - drift }, { x, y }];
            return { points, speed, easing, loopCount };
        }
        return null;
    },
    runKeyframe(filename, points, duration, easing, loopCount, options) {
        const imgUrl = this.imageBlobs[filename];
        if (!imgUrl) { dlog('Overlay image not found: ' + filename, 'error'); return; }
        if (this.active[filename]) { this.active[filename].element.remove(); delete this.active[filename]; }
        const el = document.createElement('div');
        el.className = 'overlay-item';
        const flipStr = options.flip ? 'transform:scaleX(-1);' : '';
        const scaleStr = options.scale ? 'width:' + options.scale + '%;' : '';
        el.innerHTML = `<img src="${imgUrl}" style="${flipStr}${scaleStr}">`;
        el.dataset.overlayId = filename;
        this.container.appendChild(el);
        this.active[filename] = { element: el };
        const animName = `ov_kf_${++this.keyframeCounter}`;
        let kfStr = `@keyframes ${animName} {\n`;
        for (let i = 0; i < points.length; i++) {
            const pct = points.length === 1 ? 0 : Math.round((i / (points.length - 1)) * 100);
            kfStr += `  ${pct}% { left:${points[i].x}%; top:${points[i].y}%; }\n`;
        }
        kfStr += '}';
        const styleEl = document.createElement('style');
        styleEl.textContent = kfStr;
        document.head.appendChild(styleEl);
        el.style.left = points[0].x + '%';
        el.style.top = points[0].y + '%';
        const iterStr = loopCount === Infinity ? 'infinite' : String(loopCount);
        const fillStr = loopCount === Infinity ? 'none' : 'forwards';
        el.style.animation = `${animName} ${duration}ms ${easing} ${iterStr} ${fillStr}`;
        dlog('Overlay KF: ' + filename + ' pts=' + points.length + ' dur=' + duration + 'ms loop=' + iterStr, 'cmd');
        if (loopCount !== Infinity) {
            setTimeout(() => { styleEl.remove(); }, duration * loopCount + 100);
        }
    },
    async run(cmd) {
        // OVERLAY:CLEAR
        if (cmd.toUpperCase().startsWith('CLEAR')) {
            const parts = cmd.slice(5).split(':').filter(p => p);
            if (parts.length === 0) { this.clearAll(); return; }
            const upperParts = parts.map(p => p.toUpperCase());
            const isFade = upperParts.includes('FADE');
            const fadeTime = parts.find(p => /^\d+MS$/i.test(p));
            const filename = parts.find(p => !['FADE'].includes(p.toUpperCase()) && !/^\d+MS$/i.test(p));
            const targets = filename ? [filename] : Object.keys(this.active);
            for (const id of targets) {
                const ov = this.active[id];
                if (!ov) continue;
                if (isFade) {
                    ov.element.style.transition = `opacity ${fadeTime ? parseInt(fadeTime) : 300}ms`;
                    ov.element.style.opacity = '0';
                    await sleep(fadeTime ? parseInt(fadeTime) : 300);
                }
                ov.element.remove();
                delete this.active[id];
            }
            return;
        }
        // Split: filename : motion : rest...
        const firstColon = cmd.indexOf(':');
        if (firstColon === -1) return;
        const filename = cmd.slice(0, firstColon);
        const motionStr = cmd.slice(firstColon + 1);
        // Try new syntax
        const parsed = this.parseNewSyntax(motionStr);
        if (parsed) {
            this.runKeyframe(filename, parsed.points, parsed.speed, parsed.easing, parsed.loopCount, {});
            return;
        }
        // Legacy syntax
        const parts = motionStr.split(':');
        const direction = (parts[0] || 'top').toLowerCase();
        const pathStr = parts[1] || '-100>50';
        const speedStr = parts[2];
        const easingStr = parts[3];
        const loopStr = parts[4];
        const pathParts = pathStr.split('>').map(p => {
            if (p.includes('|')) {
                const [pos, delay] = p.split('|');
                return { pos: parseFloat(pos), delay: parseInt(delay) };
            }
            return { pos: parseFloat(p), delay: 0 };
        });
        const speeds = (speedStr || '500ms').split(',').map(s => this.parseSpeed(s));
        const easings = (easingStr || 'easeOut').split(',').map(e => this.parseEasing(e));
        const loopCount = loopStr === 'loop' ? Infinity : (parseInt(loopStr) || 1);
        const imgUrl = this.imageBlobs[filename];
        if (!imgUrl) { dlog('Overlay image not found: ' + filename, 'error'); return; }
        if (this.active[filename]) { this.active[filename].element.remove(); delete this.active[filename]; }
        const el = document.createElement('div');
        el.className = 'overlay-item';
        el.innerHTML = `<img src="${imgUrl}">`;
        el.dataset.overlayId = filename;
        this.container.appendChild(el);
        this.active[filename] = { element: el };
        const setPosition = (percent) => {
            if (direction === 'top' || direction === 'bottom') {
                el.style.left = '50%';
                el.style.transform = `translateX(-50%) translateY(${percent}%)`;
                el.style.top = '0'; el.style.bottom = 'auto';
            } else {
                el.style.top = '50%';
                el.style.transform = `translateY(-50%) translateX(${percent}%)`;
                el.style.left = '0'; el.style.right = 'auto';
            }
        };
        const animate = async () => {
            for (let i = 0; i < pathParts.length; i++) {
                const { pos, delay } = pathParts[i];
                const speed = speeds[Math.min(i, speeds.length - 1)];
                const easing = easings[Math.min(i, easings.length - 1)];
                if (i === 0) {
                    el.style.transition = 'none';
                    setPosition(pos);
                    void el.offsetWidth;
                } else {
                    el.style.transition = `all ${speed}ms ${easing}`;
                    setPosition(pos);
                    await sleep(speed);
                }
                if (delay > 0) await sleep(delay);
            }
        };
        for (let loop = 0; loop < loopCount; loop++) {
            if (!this.active[filename]) break;
            await animate();
        }
    }
};

// ============================================================
//  CommandParser — コマンド実行エンジン
// ============================================================
const CommandParser = {
    splitLine(line) {
        const parts = []; let cur = ''; let depth = 0;
        for (let i = 0; i < line.length; i++) {
            const c = line[i];
            if (c === '(') depth++;
            else if (c === ')') depth--;
            if (c === ',' && depth === 0) {
                if (line[i + 1] === '(') { cur += c; } else { const t = cur.trim(); if (t) parts.push(t); cur = ''; }
            } else { cur += c; }
        }
        const t = cur.trim();
        if (t) parts.push(t);
        return parts;
    },

    async runCmd(cmd, state) {
        dlog('CMD: ' + cmd, 'cmd');
        const origCmd = cmd;
        cmd = cmd.toUpperCase().trim();
        if (cmd.startsWith('@')) cmd = cmd.slice(1);
        let m;
        // SE
        m = cmd.match(/^SE:([^:]+)(?::(\d+))?$/);
        if (m) { const name = origCmd.trim().split(':')[1].toLowerCase(); const count = m[2] !== undefined ? +m[2] : 1; AudioManager.playSE(name, count); return null; }
        m = cmd.match(/^SE:STOP(?::(.+))?$/);
        if (m) { if (m[1]) AudioManager.stopSE(m[1].toLowerCase()); else AudioManager.stopAllSE(); return null; }
        // 旧SE構文
        m = cmd.match(/^([123])SE(\d+)$/);
        if (m) { AudioManager.playSE('se0' + m[1], +m[2]); return null; }
        // FLASH / SHAKE
        m = cmd.match(/^FLASH(\d*)$/);
        if (m) { const n = +m[1] || 1; for (let i = 0; i < n; i++) { state.doFlash(); if (i < n - 1) await sleep(150); } return null; }
        m = cmd.match(/^SHAKE(\d*)$/);
        if (m) { const n = +m[1] || 1; for (let i = 0; i < n; i++) { state.doShake(); if (i < n - 1) await sleep(300); } return null; }
        // BGM
        m = cmd.match(/^BGM:([^:]+)$/);
        if (m) { const name = origCmd.trim().split(':')[1].toLowerCase(); AudioManager.playBGM(name); return null; }
        if (cmd === 'BGM:STOP') { AudioManager.stopBGM(); return null; }
        // FLAGS
        m = cmd.match(/^SETFLAG:(.+)$/);
        if (m) { state.flags[m[1]] = true; return null; }
        m = cmd.match(/^IFFLAG:(.+):SKIP$/);
        if (m) { if (state.flags[m[1]]) return 'SKIP'; return null; }
        m = cmd.match(/^IFFLAG:(.+):GOTO:(.+)$/);
        if (m) { if (state.flags[m[1]]) return { goto: m[2] }; return null; }
        m = cmd.match(/^NOTFLAG:(.+):GOTO:(.+)$/);
        if (m) { if (!state.flags[m[1]]) return { goto: m[2] }; return null; }
        // FROM (choice origin)
        m = cmd.match(/^FROM:(.+):SKIP$/);
        if (m) { if (state.lastChoiceId === m[1]) return 'SKIP'; return null; }
        m = cmd.match(/^FROM:(.+):GOTO:(.+)$/);
        if (m) { if (state.lastChoiceId === m[1]) return { goto: m[2] }; return null; }
        // COUNTER
        m = cmd.match(/^SETCOUNTER:([^:]+):(-?\d+)$/);
        if (m) { CounterManager.set(m[1], parseInt(m[2])); return null; }
        m = cmd.match(/^ADDCOUNTER:([^:]+):(-?\d+)$/);
        if (m) { CounterManager.add(m[1], parseInt(m[2])); return null; }
        m = cmd.match(/^RESETCOUNTER:([^:]+)$/);
        if (m) { CounterManager.reset(m[1]); return null; }
        m = cmd.match(/^IFCOUNTER:([^:]+):(>=|<=|==|!=|>|<):(-?\d+):GOTO:(.+)$/);
        if (m) {
            const val = CounterManager.get(m[1]), cmp = parseInt(m[3]); let r = false;
            switch (m[2]) { case '>=': r = val >= cmp; break; case '<=': r = val <= cmp; break; case '==': r = val == cmp; break; case '!=': r = val != cmp; break; case '>': r = val > cmp; break; case '<': r = val < cmp; break; }
            if (r) return { goto: m[4] }; return null;
        }
        m = cmd.match(/^IFCOUNTER:([^:]+):(>=|<=|==|!=|>|<):(-?\d+):SKIP$/);
        if (m) {
            const val = CounterManager.get(m[1]), cmp = parseInt(m[3]); let r = false;
            switch (m[2]) { case '>=': r = val >= cmp; break; case '<=': r = val <= cmp; break; case '==': r = val == cmp; break; case '!=': r = val != cmp; break; case '>': r = val > cmp; break; case '<': r = val < cmp; break; }
            if (r) return 'SKIP'; return null;
        }
        // OVERLAY (case-sensitive for filename)
        if (cmd.startsWith('OVERLAY:')) {
            const overlayCmd = origCmd.trim().slice(8);
            await OverlayManager.run(overlayCmd);
            return null;
        }
        return null;
    },

    async runSequence(str, state) {
        if (!str) return null;
        const lines = str.split('\n').map(l => l.trim()).filter(l => l);
        for (const line of lines) {
            const parts = this.splitLine(line);
            for (let i = 0; i < parts.length; i++) {
                const group = [parts[i]];
                while (i + 1 < parts.length && parts[i + 1].startsWith('@')) { group.push(parts[++i]); }
                const results = await Promise.all(group.map(c => this.runCmd(c, state)));
                for (const r of results) {
                    if (r === 'SKIP') return 'SKIP';
                    if (r && r.goto) return r;
                }
            }
        }
        return null;
    }
};

// ============================================================
//  GameState — ゲームの状態管理（メインコントローラー）
// ============================================================
const GameState = {
    // --- Data ---
    scenes: [],
    imageBlobs: {},
    chapters: [],
    projectId: null,

    // --- Runtime ---
    currentIndex: 0,
    flags: {},
    lastChoiceId: null,
    seenScenes: new Set(),
    newSceneUUIDs: new Set(),
    backlog: [],
    isGalleryMode: false,

    // --- Settings ---
    textSpeed: 70,
    autoSpeed: 2000,
    fontSize: 'm',

    // --- Play mode ---
    isAutoMode: false,
    isSkipMode: false,
    isTextHidden: false,
    autoTimer: null,
    skipTimer: null,
    textAnimTimer: null,
    isTextAnimating: false,

    // --- DOM refs (set in init) ---
    dom: {},

    // ============ Init ============
    init() {
        this.dom = {
            topMenu: $('topMenu'), gameContainer: $('gameContainer'), gameCanvas: $('gameCanvas'),
            gameBg: $('gameBg'), flashOverlay: $('flashOverlay'), textDisplay: $('textDisplay'),
            charName: $('charName'), dialogue: $('dialogue'), choiceOverlay: $('choiceOverlay'),
            sideMenu: $('sideMenu'), newScenesBanner: $('newScenesBanner'),
            autoIcon: $('autoIcon'), skipIcon: $('skipIcon'), globalTimerEl: $('globalTimer'),
            overlayContainer: $('overlayContainer')
        };
        OverlayManager.init(this.dom.overlayContainer, this.imageBlobs);
        this.bindEvents();
    },

    // ============ Effects ============
    doFlash() {
        this.dom.flashOverlay.classList.remove('active');
        void this.dom.flashOverlay.offsetWidth;
        this.dom.flashOverlay.classList.add('active');
    },
    doShake() {
        this.dom.gameCanvas.classList.remove('shake');
        void this.dom.gameCanvas.offsetWidth;
        this.dom.gameCanvas.classList.add('shake');
    },

    // ============ Transition ============
    async applyTransition(type) {
        const overlay = $('transitionOverlay');
        const bg = this.dom.gameBg;
        if (!type || type === 'none') return;
        bg.classList.remove('trans-fade', 'trans-slideLeft', 'trans-slideRight', 'trans-slideUp', 'trans-slideDown');
        overlay.classList.remove('black', 'white');
        overlay.style.opacity = '0';
        if (type === 'fadeBlack' || type === 'fadeWhite') {
            overlay.classList.add(type === 'fadeBlack' ? 'black' : 'white');
            overlay.style.opacity = '1';
            await new Promise(r => setTimeout(r, 250));
            overlay.style.transition = 'opacity 0.25s';
            overlay.style.opacity = '0';
            await new Promise(r => setTimeout(r, 250));
            overlay.style.transition = '';
        } else if (type === 'fade') {
            bg.classList.add('trans-fade');
            await new Promise(r => setTimeout(r, 500));
        } else if (type.startsWith('slide')) {
            bg.classList.add('trans-' + type);
            await new Promise(r => setTimeout(r, 400));
        }
    },

    // ============ Text Animation ============
    getTextAnimDuration(t) {
        if (this.textSpeed === 100) return 0;
        return t.length * ((100 - this.textSpeed) * 0.5 + 10);
    },
    animateText(t) {
        if (this.textSpeed === 100) { this.dom.dialogue.textContent = t; return; }
        this.dom.dialogue.textContent = '';
        this.isTextAnimating = true;
        let i = 0;
        const ct = (100 - this.textSpeed) * 0.5 + 10;
        const add = () => {
            if (i < t.length) {
                this.dom.dialogue.textContent += t[i]; i++;
                this.textAnimTimer = setTimeout(add, ct);
            } else { this.isTextAnimating = false; }
        };
        add();
    },
    finishTextAnim() {
        if (this.isTextAnimating) {
            clearTimeout(this.textAnimTimer);
            this.dom.dialogue.textContent = this.scenes[this.currentIndex]?.text || '';
            this.isTextAnimating = false;
        }
    },

    // ============ Scene Navigation ============
    findSceneByLabel(l) {
        return this.scenes.findIndex(s => s.label === l || String(s.id) === l);
    },
    async showScene() {
        if (TimerManager.timedChoiceTimer) { clearInterval(TimerManager.timedChoiceTimer); TimerManager.timedChoiceTimer = null; }
        this.dom.choiceOverlay.classList.add('hidden');
        clearTimeout(this.textAnimTimer);
        this.isTextAnimating = false;
        OverlayManager.clearAll();
        AudioManager.stopAllSE();
        if (this.currentIndex < 0 || this.currentIndex >= this.scenes.length) { this.returnToTitle(); return; }
        const scene = this.scenes[this.currentIndex];
        this.seenScenes.add(scene.uuid);
        this.newSceneUUIDs.delete(scene.uuid);
        if (this.newSceneUUIDs.size === 0) this.dom.newScenesBanner.classList.add('hidden');
        const result = await CommandParser.runSequence(scene.cmd, this);
        if (result === 'SKIP') { this.currentIndex++; this.showScene(); return; }
        if (result && result.goto) { const idx = this.findSceneByLabel(result.goto); if (idx >= 0) { this.currentIndex = idx; this.showScene(); return; } }
        // Timer
        if (scene.timerStart && scene.timerStartId) { TimerManager.start(scene.timerStartId, scene.timerStartSeconds || 60, scene.timerMode || 'realtime', scene.timerShow !== false); }
        if (scene.timerEnd && scene.timerEndId) { TimerManager.end(scene.timerEndId); }
        for (const id in TimerManager.globalTimers) { if (TimerManager.globalTimers[id].mode === 'selection') { TimerManager.decrement(id, 1); } }
        // BG
        this.dom.gameBg.innerHTML = scene.bgUrl ? `<img src="${scene.bgUrl}">` : '';
        await this.applyTransition(scene.transition);
        // Text
        this.dom.charName.textContent = scene.name || '';
        this.dom.charName.style.display = scene.name ? 'block' : 'none';
        this.animateText(scene.text || '');
        if (scene.textMode === 'nvl') { this.dom.textDisplay.classList.add('nvl-mode'); } else { this.dom.textDisplay.classList.remove('nvl-mode'); }
        if (scene.name || scene.text) {
            this.backlog.push({ index: this.currentIndex, name: scene.name || '', text: scene.text || '' });
            if (this.backlog.length > 100) this.backlog.shift();
        }
        // Choice
        if (scene.isChoice && scene.choices && scene.choices.length > 0) {
            const showFn = () => {
                if (scene.isTimed && scene.timedSeconds > 0) {
                    this.showTimedChoices(scene.choices, scene.timedSeconds, scene.showTimer !== false, scene.forceProgress !== false, scene.timeoutGoto);
                } else { this.showChoices(scene.choices); }
            };
            if (this.isSkipMode || this.textSpeed === 100) { showFn(); } else { setTimeout(showFn, this.getTextAnimDuration(scene.text || '')); }
            this.stopAuto(); this.stopSkip();
        }
        // Auto-save
        if (!this.isGalleryMode) SaveManager.saveSlot(0, this);
        // Auto / Skip
        if (this.isAutoMode && !scene.isChoice) {
            this.autoTimer = setTimeout(() => { if (this.isAutoMode) this.nextScene(); }, this.getTextAnimDuration(scene.text || '') + this.autoSpeed);
        }
        if (this.isSkipMode && !scene.isChoice && this.seenScenes.has(scene.uuid)) {
            this.skipTimer = setTimeout(() => { if (this.isSkipMode) this.nextScene(); }, 50);
        } else if (this.isSkipMode && !this.seenScenes.has(scene.uuid)) { this.stopSkip(); }
    },
    nextScene() {
        if (!this.dom.choiceOverlay.classList.contains('hidden')) return;
        if (this.isTextAnimating) { this.finishTextAnim(); return; }
        if (this.currentIndex < this.scenes.length - 1) { this.currentIndex++; this.showScene(); }
        else { this.returnToTitle(); }
    },
    prevScene() {
        if (!this.dom.choiceOverlay.classList.contains('hidden')) return;
        if (this.currentIndex > 0) { this.currentIndex--; this.showScene(); }
    },

    // ============ Choices ============
    showChoices(choices) {
        this.dom.choiceOverlay.innerHTML = '';
        choices.forEach(c => {
            const b = document.createElement('button');
            b.className = 'choice-btn';
            b.textContent = c.text || c.id;
            b.onclick = () => this.selectChoice(c);
            this.dom.choiceOverlay.appendChild(b);
        });
        this.dom.choiceOverlay.classList.remove('hidden');
    },
    selectChoice(c) {
        if (c.timerDelta) { for (const id in TimerManager.globalTimers) { TimerManager.decrement(id, -c.timerDelta); } }
        this.lastChoiceId = c.id;
        this.dom.choiceOverlay.classList.add('hidden');
        if (c.goto) { const idx = this.findSceneByLabel(c.goto); if (idx >= 0) { this.currentIndex = idx; this.showScene(); return; } }
        this.currentIndex++;
        this.showScene();
    },
    showTimedChoices(choices, seconds, showTimer, forceProgress, timeoutGoto) {
        this.dom.choiceOverlay.innerHTML = '';
        if (showTimer) {
            const radius = 40, circumference = 2 * Math.PI * radius;
            const timerContainer = document.createElement('div');
            timerContainer.className = 'choice-timer-container';
            timerContainer.innerHTML = `<div class="choice-timer-circle"><svg viewBox="0 0 100 100"><circle class="timer-bg" cx="50" cy="50" r="${radius}"/><circle class="timer-progress" id="timerProgress" cx="50" cy="50" r="${radius}" stroke-dasharray="${circumference}" stroke-dashoffset="0"/></svg><div class="choice-timer-number" id="timerNumber">${seconds}</div></div>`;
            this.dom.choiceOverlay.appendChild(timerContainer);
        }
        choices.forEach(c => {
            const b = document.createElement('button');
            b.className = 'choice-btn';
            b.textContent = c.text || c.id;
            b.onclick = () => this.selectTimedChoice(c);
            this.dom.choiceOverlay.appendChild(b);
        });
        this.dom.choiceOverlay.classList.remove('hidden');
        const startTime = Date.now(), circumference = 2 * Math.PI * 40;
        TimerManager.timedChoiceTimer = setInterval(() => {
            const elapsed = (Date.now() - startTime) / 1000, remaining = Math.max(0, seconds - elapsed);
            if (showTimer) {
                const progress = $('timerProgress'), number = $('timerNumber');
                if (progress && number) {
                    const offset = circumference * (elapsed / seconds);
                    progress.style.strokeDashoffset = offset;
                    number.textContent = Math.ceil(remaining);
                    const isUrgent = remaining <= 3;
                    progress.classList.toggle('urgent', isUrgent);
                    number.classList.toggle('urgent', isUrgent);
                }
            }
            if (remaining <= 0) {
                clearInterval(TimerManager.timedChoiceTimer);
                TimerManager.timedChoiceTimer = null;
                this.dom.choiceOverlay.classList.add('hidden');
                if (timeoutGoto) { const idx = this.findSceneByLabel(timeoutGoto); if (idx >= 0) { this.currentIndex = idx; this.showScene(); return; } }
                if (forceProgress) { this.currentIndex++; this.showScene(); }
            }
        }, 100);
    },
    selectTimedChoice(c) {
        if (c.timerDelta) { for (const id in TimerManager.globalTimers) { TimerManager.decrement(id, -c.timerDelta); } }
        if (TimerManager.timedChoiceTimer) { clearInterval(TimerManager.timedChoiceTimer); TimerManager.timedChoiceTimer = null; }
        this.lastChoiceId = c.id;
        this.dom.choiceOverlay.classList.add('hidden');
        if (c.goto) { const idx = this.findSceneByLabel(c.goto); if (idx >= 0) { this.currentIndex = idx; this.showScene(); return; } }
        this.currentIndex++;
        this.showScene();
    },

    // ============ Auto / Skip / Text Hide ============
    toggleAuto() {
        this.isAutoMode = !this.isAutoMode;
        $('autoBtn').classList.toggle('active', this.isAutoMode);
        this.dom.autoIcon.classList.toggle('hidden', !this.isAutoMode);
        if (this.isAutoMode) {
            this.stopSkip();
            const s = this.scenes[this.currentIndex];
            if (!s?.isChoice && !this.isTextAnimating) {
                this.autoTimer = setTimeout(() => { if (this.isAutoMode) this.nextScene(); }, this.autoSpeed);
            }
        } else { clearTimeout(this.autoTimer); }
    },
    stopAuto() {
        this.isAutoMode = false;
        $('autoBtn').classList.remove('active');
        this.dom.autoIcon.classList.add('hidden');
        clearTimeout(this.autoTimer);
    },
    toggleSkip() {
        this.isSkipMode = !this.isSkipMode;
        $('skipBtn').classList.toggle('active', this.isSkipMode);
        this.dom.skipIcon.classList.toggle('hidden', !this.isSkipMode);
        if (this.isSkipMode) {
            this.stopAuto(); this.finishTextAnim();
            const s = this.scenes[this.currentIndex];
            if (!s?.isChoice && this.seenScenes.has(s?.uuid)) {
                this.skipTimer = setTimeout(() => { if (this.isSkipMode) this.nextScene(); }, 50);
            }
        } else { clearTimeout(this.skipTimer); }
    },
    stopSkip() {
        this.isSkipMode = false;
        $('skipBtn').classList.remove('active');
        this.dom.skipIcon.classList.add('hidden');
        clearTimeout(this.skipTimer);
    },
    toggleTextHidden() {
        this.isTextHidden = !this.isTextHidden;
        this.dom.textDisplay.classList.toggle('hidden-text', this.isTextHidden);
        $('hideTextBtn').classList.toggle('active', this.isTextHidden);
    },

    // ============ Game Flow ============
    startGame(from = 0) {
        AudioManager.unlock();
        this.currentIndex = from;
        this.flags = {};
        this.lastChoiceId = null;
        this.backlog = [];
        TimerManager.reset();
        OverlayManager.clearAll();
        this.dom.topMenu.classList.add('hidden');
        this.dom.gameContainer.classList.remove('hidden');
        this.isGalleryMode = false;
        this.stopAuto(); this.stopSkip();
        this.showScene();
    },
    continueGame() {
        AudioManager.unlock();
        if (SaveManager.loadSlot(0, this)) {
            this.dom.topMenu.classList.add('hidden');
            this.dom.gameContainer.classList.remove('hidden');
            this.isGalleryMode = false;
            this.stopAuto(); this.stopSkip();
            this.showScene();
        }
    },
    returnToTitle() {
        this.dom.gameContainer.classList.add('hidden');
        this.dom.sideMenu.classList.remove('open');
        this.dom.topMenu.classList.remove('hidden');
        AudioManager.stopBGM();
        AudioManager.stopAllSE();
        this.stopAuto(); this.stopSkip();
        TimerManager.reset();
        OverlayManager.clearAll();
        this.checkNewScenes();
        this.updateNewScenesButton();
    },

    // ============ New Scenes ============
    checkNewScenes() {
        this.newSceneUUIDs.clear();
        this.scenes.forEach(s => { if (!this.seenScenes.has(s.uuid)) this.newSceneUUIDs.add(s.uuid); });
    },
    updateNewScenesButton() {
        const b = $('newScenesBtn');
        if (this.newSceneUUIDs.size > 0) {
            b.classList.remove('hidden'); b.classList.add('has-new');
            b.textContent = `New Scenes (${this.newSceneUUIDs.size})`; b.disabled = false;
        } else { b.classList.add('hidden'); }
    },
    goToNewScenes() {
        const idx = this.scenes.findIndex(s => this.newSceneUUIDs.has(s.uuid));
        if (idx >= 0) { this.startGame(idx); this.dom.newScenesBanner.classList.remove('hidden'); }
    },

    // ============ Settings UI ============
    updateSettingsUI() {
        $('bgmVolume').value = AudioManager.bgmVolume * 100;
        $('seVolume').value = AudioManager.seVolume * 100;
        $('settingsBgmVolume').value = AudioManager.bgmVolume * 100;
        $('settingsSeVolume').value = AudioManager.seVolume * 100;
        $('textSpeed').value = this.textSpeed;
        $('settingsTextSpeed').value = this.textSpeed;
        $('autoSpeed').value = this.autoSpeed;
        if (AudioManager.currentBgmGain) AudioManager.currentBgmGain.gain.value = AudioManager.bgmVolume;
        document.querySelectorAll('.size-btn').forEach(b => b.classList.toggle('active', b.dataset.size === this.fontSize));
        this.dom.charName.className = `char-name size-${this.fontSize}`;
        this.dom.dialogue.className = `dialogue size-${this.fontSize}`;
    },

    // ============ Modals ============
    openGallery() {
        const g = $('galleryGrid'); g.innerHTML = '';
        this.scenes.forEach((s, i) => {
            if (!s.bgUrl) return;
            const seen = this.seenScenes.has(s.uuid);
            const isNew = this.newSceneUUIDs.has(s.uuid);
            const item = document.createElement('div');
            item.className = 'gallery-item' + (seen ? '' : ' locked') + (isNew ? ' new' : '');
            if (seen) {
                item.innerHTML = `<img src="${s.bgUrl}">`;
                item.onclick = () => { $('galleryModal').classList.add('hidden'); this.isGalleryMode = true; this.currentIndex = i; this.dom.topMenu.classList.add('hidden'); this.dom.gameContainer.classList.remove('hidden'); this.showScene(); };
            }
            g.appendChild(item);
        });
        $('galleryModal').classList.remove('hidden');
    },
    openBacklog() {
        const l = $('backlogList'); l.innerHTML = '';
        if (this.backlog.length === 0) {
            l.innerHTML = '<div style="text-align:center;color:var(--text-dim);padding:24px;">No backlog</div>';
        } else {
            this.backlog.forEach(e => {
                const item = document.createElement('div');
                item.className = 'backlog-item';
                item.innerHTML = `${e.name ? `<div class="backlog-name">${e.name}</div>` : ''}<div class="backlog-text">${e.text}</div>`;
                l.appendChild(item);
            });
            l.scrollTop = l.scrollHeight;
        }
        $('backlogModal').classList.remove('hidden');
    },
    openSaveModal() {
        const c = $('saveSlots'); c.innerHTML = '';
        // Quick save
        const qi = SaveManager.getSlotInfo(-1);
        const qs = document.createElement('div');
        qs.className = 'save-slot save-slot-quick' + (qi.exists ? '' : ' empty');
        qs.innerHTML = `<div class="save-slot-title">Quick Save</div><div class="save-slot-info">${qi.exists ? qi.date : 'Empty'}</div>`;
        qs.onclick = () => { this.quickSave(); $('saveModal').classList.add('hidden'); };
        c.appendChild(qs);
        // Auto save
        const ai = SaveManager.getSlotInfo(0);
        const as = document.createElement('div');
        as.className = 'save-slot save-slot-auto' + (ai.exists ? '' : ' empty');
        as.innerHTML = `<div class="save-slot-title">Auto Save</div><div class="save-slot-info">${ai.exists ? ai.date : 'Empty'}</div>`;
        c.appendChild(as);
        // Slots 1-10
        for (let i = 1; i <= 10; i++) {
            const info = SaveManager.getSlotInfo(i);
            const slot = document.createElement('div');
            slot.className = 'save-slot' + (info.exists ? '' : ' empty');
            slot.innerHTML = `<div class="save-slot-title">Slot ${i}</div><div class="save-slot-info">${info.exists ? info.date : 'Empty'}</div>`;
            slot.onclick = () => { SaveManager.saveSlot(i, this); showToast('Saved'); $('saveModal').classList.add('hidden'); };
            c.appendChild(slot);
        }
        $('saveModal').classList.remove('hidden');
    },
    openLoadModal() {
        const c = $('loadSlots'); c.innerHTML = '';
        const qi = SaveManager.getSlotInfo(-1);
        if (qi.exists) {
            const qs = document.createElement('div');
            qs.className = 'save-slot save-slot-quick';
            qs.innerHTML = `<div class="save-slot-title">Quick Save</div><div class="save-slot-info">${qi.date}</div>`;
            qs.onclick = () => { $('loadModal').classList.add('hidden'); this.dom.sideMenu.classList.remove('open'); this.quickLoad(); };
            c.appendChild(qs);
        }
        const ai = SaveManager.getSlotInfo(0);
        if (ai.exists) {
            const as = document.createElement('div');
            as.className = 'save-slot save-slot-auto';
            as.innerHTML = `<div class="save-slot-title">Auto Save</div><div class="save-slot-info">${ai.date}</div>`;
            as.onclick = () => { if (SaveManager.loadSlot(0, this)) { $('loadModal').classList.add('hidden'); this.dom.sideMenu.classList.remove('open'); this.showScene(); } };
            c.appendChild(as);
        }
        for (let i = 1; i <= 10; i++) {
            const info = SaveManager.getSlotInfo(i);
            if (!info.exists) continue;
            const slot = document.createElement('div');
            slot.className = 'save-slot';
            slot.innerHTML = `<div class="save-slot-title">Slot ${i}</div><div class="save-slot-info">${info.date}</div>`;
            slot.onclick = () => { if (SaveManager.loadSlot(i, this)) { $('loadModal').classList.add('hidden'); this.dom.sideMenu.classList.remove('open'); this.showScene(); } };
            c.appendChild(slot);
        }
        if (c.children.length === 0) {
            c.innerHTML = '<div style="text-align:center;color:var(--text-dim);padding:24px;">No save data</div>';
        }
        $('loadModal').classList.remove('hidden');
    },
    quickSave() { SaveManager.saveSlot(-1, this); showToast('Quick Saved'); },
    quickLoad() { if (SaveManager.loadSlot(-1, this)) { this.showScene(); showToast('Quick Loaded'); } else { showToast('No save data'); } },

    // ============ ZIP Load ============
    async loadZip(file) {
        try {
            const zip = await JSZip.loadAsync(file);
            this.scenes = [];
            this.imageBlobs = {};
            this.chapters = [];
            AudioManager.clearAll();
            const ctx = AudioManager.getCtx();
            // Images
            const imgFolder = zip.folder('images');
            if (imgFolder) {
                const files = [];
                imgFolder.forEach((p, f) => { if (!f.dir) files.push({ p, f }); });
                for (const { p, f } of files) {
                    const blob = await f.async('blob');
                    const filename = p.split('/').pop();
                    this.imageBlobs[filename] = URL.createObjectURL(blob);
                }
            }
            // Audio
            const audioFolder = zip.folder('audio');
            if (audioFolder) {
                const af = [];
                audioFolder.forEach((p, f) => { if (!f.dir) af.push({ p, f }); });
                for (const { p, f } of af) {
                    const arrayBuf = await f.async('arraybuffer');
                    const filename = p.split('/').pop();
                    const name = filename.split('.')[0].toLowerCase();
                    dlog('Audio decoding: ' + p + ' -> ' + name, 'audio');
                    try {
                        const audioBuf = await ctx.decodeAudioData(arrayBuf.slice(0));
                        if (name.startsWith('se')) {
                            AudioManager.seBuffers[name] = audioBuf;
                            AudioManager.seAudios[name] = { url: '' };
                            dlog('  SE decoded: ' + name + ' (' + audioBuf.duration.toFixed(2) + 's)', 'audio');
                        } else if (name.startsWith('bgm')) {
                            AudioManager.bgmBuffers[name] = audioBuf;
                            AudioManager.bgmAudios[name] = { url: '' };
                            dlog('  BGM decoded: ' + name + ' (' + audioBuf.duration.toFixed(2) + 's)', 'audio');
                        }
                    } catch (decErr) { dlog('Audio decode error: ' + name + ' ' + decErr.message, 'error'); }
                }
            }
            // Data
            const dataFile = zip.file('data.json');
            if (dataFile) {
                const json = await dataFile.async('string');
                const data = JSON.parse(json);
                this.projectId = generateProjectId(data.scenes);
                SaveManager.projectId = this.projectId;
                CounterManager.projectId = this.projectId;
                this.scenes = (data.scenes || []).map((s, i) => ({ ...s, uuid: s.uuid || `scene-${i}-${s.id}`, bgUrl: s.bg && this.imageBlobs[s.bg] ? this.imageBlobs[s.bg] : null }));
                this.chapters = data.chapters || [];
                if (data.title) $('gameTitle').textContent = data.title;
                if (data.projectWidth && data.projectHeight) {
                    document.documentElement.style.setProperty('--project-ratio', data.projectWidth + '/' + data.projectHeight);
                }
            }
            // Update imageBlobs ref for OverlayManager
            OverlayManager.imageBlobs = this.imageBlobs;
            SaveManager.loadProgress(this);
            CounterManager.load();
            this.checkNewScenes();
            $('startBtn').disabled = false;
            $('galleryBtn').disabled = false;
            $('continueBtn').disabled = !SaveManager.getSlotInfo(0).exists;
            $('chaptersBtn').classList.toggle('hidden', this.chapters.length === 0);
            this.updateNewScenesButton();
            this.updateSettingsUI();
            dlog('ZIP loaded: ' + this.scenes.length + ' scenes, ' + Object.keys(AudioManager.seBuffers).length + ' SE [' + Object.keys(AudioManager.seBuffers).join(',') + '], ' + Object.keys(AudioManager.bgmBuffers).length + ' BGM [' + Object.keys(AudioManager.bgmBuffers).join(',') + '], ' + Object.keys(this.imageBlobs).length + ' images', 'info');
        } catch (err) {
            console.error(err);
            dlog('ZIP load error: ' + err.message, 'error');
            alert('Load error: ' + err.message);
        }
    },

    // ============ Event Bindings ============
    bindEvents() {
        const G = this;
        // Title menu
        $('startBtn').onclick = () => G.startGame(0);
        $('continueBtn').onclick = () => G.continueGame();
        $('newScenesBtn').onclick = () => G.goToNewScenes();
        $('galleryBtn').onclick = () => G.openGallery();
        $('settingsBtn').onclick = () => $('settingsModal').classList.remove('hidden');
        $('chaptersBtn').onclick = () => {
            const list = $('chaptersList'); list.innerHTML = '';
            G.chapters.forEach((ch, i) => {
                if (ch.sceneIndex < 0 || ch.sceneIndex >= G.scenes.length) return;
                const scene = G.scenes[ch.sceneIndex];
                const item = document.createElement('div');
                item.className = 'chapter-item';
                item.innerHTML = `<div class="chapter-thumb">${scene.bgUrl ? `<img src="${scene.bgUrl}">` : ''}</div><div class="chapter-info"><div class="chapter-title">${ch.comment || 'Chapter ' + (i + 1)}</div><div class="chapter-num">Scene #${ch.sceneIndex + 1}</div></div>`;
                item.onclick = () => { $('chaptersModal').classList.add('hidden'); G.startGame(ch.sceneIndex); };
                list.appendChild(item);
            });
            $('chaptersModal').classList.remove('hidden');
        };
        // Control panel
        $('ctrlToggleBtn').onclick = () => $('ctrlMenu').classList.toggle('open');
        $('hamburgerBtn').onclick = () => G.dom.sideMenu.classList.toggle('open');
        $('closeSideMenu').onclick = () => G.dom.sideMenu.classList.remove('open');
        // Side menu
        $('sideMenuSave').onclick = () => { G.dom.sideMenu.classList.remove('open'); G.openSaveModal(); };
        $('sideMenuLoad').onclick = () => { G.dom.sideMenu.classList.remove('open'); G.openLoadModal(); };
        $('sideMenuBacklog').onclick = () => { G.dom.sideMenu.classList.remove('open'); G.openBacklog(); };
        $('sideMenuGallery').onclick = () => { G.dom.sideMenu.classList.remove('open'); G.openGallery(); };
        $('sideMenuTitle').onclick = () => G.returnToTitle();
        $('sideMenuDebug').onclick = () => { G.dom.sideMenu.classList.remove('open'); $('debugConsole').classList.remove('hidden'); };
        $('debugClose').onclick = () => $('debugConsole').classList.add('hidden');
        $('debugClear').onclick = () => { $('debugLog').innerHTML = ''; dlog('Console cleared', 'info'); };
        // Play controls
        $('hideTextBtn').onclick = () => G.toggleTextHidden();
        $('autoBtn').onclick = () => G.toggleAuto();
        $('skipBtn').onclick = () => G.toggleSkip();
        $('qsaveBtn').onclick = () => G.quickSave();
        $('qloadBtn').onclick = () => G.quickLoad();
        // Modal close buttons
        $('closeSaveModal').onclick = () => $('saveModal').classList.add('hidden');
        $('closeLoadModal').onclick = () => $('loadModal').classList.add('hidden');
        $('closeGalleryModal').onclick = () => $('galleryModal').classList.add('hidden');
        $('closeBacklogModal').onclick = () => $('backlogModal').classList.add('hidden');
        $('closeSettingsModal').onclick = () => $('settingsModal').classList.add('hidden');
        $('closeChaptersModal').onclick = () => $('chaptersModal').classList.add('hidden');
        // Modal backdrop click
        ['saveModal', 'loadModal', 'galleryModal', 'backlogModal', 'settingsModal', 'chaptersModal'].forEach(id => {
            $(id).onclick = e => { if (e.target === $(id)) $(id).classList.add('hidden'); };
        });
        // Settings sliders
        ['bgmVolume', 'settingsBgmVolume'].forEach(id => {
            $(id).oninput = e => { AudioManager.bgmVolume = e.target.value / 100; G.updateSettingsUI(); SaveManager.saveProgress(G); };
        });
        ['seVolume', 'settingsSeVolume'].forEach(id => {
            $(id).oninput = e => { AudioManager.seVolume = e.target.value / 100; G.updateSettingsUI(); SaveManager.saveProgress(G); };
        });
        ['textSpeed', 'settingsTextSpeed'].forEach(id => {
            $(id).oninput = e => { G.textSpeed = +e.target.value; G.updateSettingsUI(); SaveManager.saveProgress(G); };
        });
        $('autoSpeed').oninput = e => { G.autoSpeed = +e.target.value; SaveManager.saveProgress(G); };
        document.querySelectorAll('.size-btn').forEach(b => {
            b.onclick = () => { G.fontSize = b.dataset.size; G.updateSettingsUI(); SaveManager.saveProgress(G); };
        });
        // New scenes banner
        G.dom.newScenesBanner.onclick = () => {
            const idx = G.scenes.findIndex((s, i) => i > G.currentIndex && G.newSceneUUIDs.has(s.uuid));
            if (idx >= 0) { G.currentIndex = idx; G.showScene(); } else { G.dom.newScenesBanner.classList.add('hidden'); }
        };
        // Canvas click
        G.dom.gameCanvas.onclick = e => {
            if (e.target.closest('.control-panel') || e.target.closest('.side-menu') || e.target.closest('.choice-btn') || e.target.closest('.choice-timer-container')) return;
            if (G.dom.sideMenu.classList.contains('open')) { G.dom.sideMenu.classList.remove('open'); return; }
            if (G.isTextHidden) { G.toggleTextHidden(); return; }
            G.nextScene();
        };
        // Keyboard
        let lastUpTime = 0;
        document.onkeydown = e => {
            if (G.dom.gameContainer.classList.contains('hidden')) return;
            if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'Enter') { if (G.isTextHidden) { G.toggleTextHidden(); return; } G.nextScene(); }
            if (e.key === 'ArrowLeft') G.prevScene();
            if (e.key === 'ArrowUp') { const now = Date.now(); if (now - lastUpTime < 500) G.returnToTitle(); lastUpTime = now; }
            if (e.key === 'Escape') G.dom.sideMenu.classList.toggle('open');
            if (e.key === 'a' || e.key === 'A') G.toggleAuto();
            if (e.key === 's' || e.key === 'S') G.toggleSkip();
            if (e.key === 'l' || e.key === 'L') G.openBacklog();
            if (e.key === 'h' || e.key === 'H') G.toggleTextHidden();
            if (e.key === 'q' || e.key === 'Q') G.quickSave();
            if (e.key === 'w' || e.key === 'W') G.quickLoad();
        };
        // ZIP input
        $('zipInput').onchange = async e => {
            const file = e.target.files[0];
            if (file) G.loadZip(file);
        };
    }
};

// ============================================================
//  Boot
// ============================================================
GameState.init();
</script>
